# The host for jgenesis, a Mega Drive emulator that is a Rust crate rather than a
# libretro core, so core-shim cannot drive it. This crate is the piece that does: it
# owns the console, a fixed canvas its picture is copied into, and the flat surface
# gatherum.js expects — Gecko's host without the GPU.
#
# Its dependencies point into native/build/jgenesis, which build-core.sh fetches at a
# pinned release and which is not committed. See native/README.md.
[package]
name = "gatherum-jgenesis-host"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
genesis-core = { path = "../build/jgenesis/backend/genesis-core" }
genesis-config = { path = "../build/jgenesis/config/genesis-config" }
jgenesis-common = { path = "../build/jgenesis/common/jgenesis-common" }
bincode = "2"
# Exactly the version of the tool build-core.sh fetches: the two check each other and
# refuse to work across a mismatch, and a fresh lockfile would otherwise pick a newer one.
wasm-bindgen = "=0.2.118"
console_error_panic_hook = "0.1.7"
# jgenesis-common brings rand along for its randomised arrays, none of which the Mega
# Drive uses; getrandom still has to know it is in a browser to compile at all.
getrandom = { version = "0.4", features = ["wasm_js"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
