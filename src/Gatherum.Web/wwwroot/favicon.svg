<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The G of the wordmark: outlined from Linux Libertine Regular, the head of
       the serif stack, at the 400 weight the home page sets. A path, not a text
       element, because nothing in this app self-hosts a typeface and a favicon
       that silently falls back to Times is a different mark. It sits taller in
       the box than a sans G would: a serif at 16px has no strokes to spare.

       The two fills are the light and dark values of the on-surface token, the
       same ink the header brand is set in, so the tab reads as the wordmark
       rather than a logo. The query asks the browser, not the app: this mark
       lives in the tab strip, which follows the OS even when a reader has
       pinned Gatherum itself to one theme. Chrome caches the rendered favicon,
       so a scheme flip may not repaint until the tab reloads. -->
  <style>
    path { fill: #1f1f1f; }
    @media (prefers-color-scheme: dark) { path { fill: #e3e3e3; } }
  </style>
