services:
  gatherum:
    build: .
    image: gatherum:latest
    ports:
      - "8080:8080"
    environment:
      Gatherum__Database__ConnectionString: Host=postgres;Database=gatherum;Username=gatherum;Password=gatherum
      # Uncomment and fill in to enable real sign-in; without these the app uses a
      # development auto-login and says so in its logs.
      # Gatherum__Oidc__Authority: https://auth.example.org
      # Gatherum__Oidc__ClientId: gatherum
      # Gatherum__Oidc__ClientSecret: change-me
      # Point these at a model you run to have uploaded images read and recordings
      # transcribed. host.docker.internal reaches a llama.cpp server on the host;
      # without an endpoint nothing is sent anywhere.
      # Gatherum__Analysis__Endpoint: http://host.docker.internal:8080/v1
      # Gatherum__Analysis__Model: your-any-to-any-model
    volumes:
      - gatherum-files:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: gatherum
      POSTGRES_USER: gatherum
      POSTGRES_PASSWORD: gatherum
    volumes:
      - gatherum-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatherum"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  gatherum-files:
  gatherum-db:
